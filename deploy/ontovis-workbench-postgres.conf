# 153 development/test only. Install after offline activate-new and permission checks.
# /etc/systemd/system/ontovis-workbench.service.d/registry.conf
[Service]
EnvironmentFile=/data/ontovis/private/workbench-registry.env
ExecStart=
ExecStart=/data/ontovis/runtime/registry-v1/bin/python /data/ontovis/workbench-current/code/apps/api/workbench_server.py --registry-backend postgres --workspace-root /data/ontovis/private/workbench-pg-v1/project-spaces --project-code ${ONTOVIS_PROJECT_CODE} --installation-context-id ${ONTOVIS_INSTALLATION_CONTEXT_ID} --model-root /data/ontovis/private/workbench-pg-v1/workbench-model --library-root /data/ontovis/private/workbench-pg-v1/workbench-library --terrain-python /data/ontovis/runtime/gis-current/bin/python --terrain-max-upload-bytes 100000000 --thumbnail-renderer /data/ontovis/workbench-current/public/model-thumbnail-renderer.js --thumbnail-node /usr/local/bin/node --thumbnail-browser /opt/google/chrome/chrome
ReadWritePaths=
ReadWritePaths=/data/ontovis/private/workbench-pg-v1/project-spaces /data/ontovis/private/workbench-pg-v1/workbench-library
