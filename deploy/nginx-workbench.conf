# Protected product workbench. Spatial navigation demo assets are not served.
server {
    listen 127.0.0.1:18082;
    server_name vis.ontobase.ai;
    if ($http_x_forwarded_proto = http) { return 301 https://vis.ontobase.ai$request_uri; }
    root /data/ontovis/workbench-current/public;
    charset utf-8;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health { try_files /health.json =503; }
    location ~ ^/api/session(?:/login|/logout)?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_set_header X-Vis-Client-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/workbench/(?:context|children|object|catalog|model|model/content|evidence/resolve|evidence/content)$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/models/upload {
        client_max_body_size 20m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/models(?:/binding)?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ^~ /api/demo/ { default_type application/json; return 410 '{"code":"DEMO_NOT_PUBLISHED"}'; }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location /data/ { return 404; }
    location /sources/ { return 404; }
    location /models/ { return 404; }
    location /textures/ { return 404; }
    location / { try_files $uri /index.html; }
}
server {
    listen 80;
    listen [::]:80;
    server_name vis.ontobase.ai;
    location / { return 301 https://vis.ontobase.ai$request_uri; }
}
