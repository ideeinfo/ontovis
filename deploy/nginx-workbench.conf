# Protected product workbench. Spatial navigation demo assets are not served.
# Only successful, content-named public build assets may be reused. HTML,
# session/API responses and missing assets must retain no-store.
map "$status:$uri" $ontovis_public_asset_cache_control {
    default "no-store";
    "~^(200|206|304):/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8}\.(js|css|png|webp|jpg|jpeg|svg|woff2?)$" "public, max-age=31536000, immutable";
    "~^(200|206|304):/media/login-background(-poster)?-[a-f0-9]{16}\.(mp4|webp)$" "public, max-age=31536000, immutable";
}
server {
    listen 127.0.0.1:18082;
    server_name vis.ontobase.ai;
    if ($http_x_forwarded_proto = http) { return 301 https://vis.ontobase.ai$request_uri; }
    root /data/ontovis/workbench-current/public;
    charset utf-8;
    large_client_header_buffers 4 16k;
    access_log off;
    add_header Cache-Control $ontovis_public_asset_cache_control always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # GLTFLoader decodes embedded images with ImageBitmapLoader, which fetches local blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org; media-src 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health { try_files /health.json =503; }
    location ~ ^/api/session(?:/login|/logout)?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_set_header X-Vis-Client-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/workbench/(?:projects(?:/access)?|context|children|object|catalog|model|model/content|evidence/resolve|evidence/content)$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/models/upload {
        client_max_body_size 20m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/models(?:/binding)?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/(?:scenes(?:/(?:open|head|create|locate|delete|restore))?|scenes/legacy-migration/(?:sources|entry))$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/(?:scenes/(?:save|check|replacement-check)|scenes/legacy-migration/(?:check|activate))$ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/objects/(?:context|detail|children|(?:evidence|photos)/(?:resolve|content))$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/work-orders/action {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/analysis-sessions/(?:create|save)$ {
        client_max_body_size 264k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/analysis-sessions(?:/(?:detail|restore|revisions))?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/work-orders(?:/(?:seed-demo|detail|locate|diagnosis-history))?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/resources/(?:models(?:/legacy)?|model(?:/(?:content|inspection|calibrate|import-existing|preserve-legacy-display|info/save|delete|restore|metadata|thumbnail(?:/(?:ensure|content))?))?|uses)$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/resources/model/metadata/save {
        client_max_body_size 72k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/resources/model/upload {
        client_max_body_size 20m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/terrains(?:/(?:job(?:/cancel)?|version|content))?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/terrains/upload {
        # Test deployment baseline from Cloudflare's Free/Pro 100 MB defaults:
        # https://developers.cloudflare.com/cache/concepts/default-cache-behavior/#upload-limits
        # The account plan and any custom zone limit have not been verified.
        client_max_body_size 100000000;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/imagery(?:/(?:version|content|upload-result))?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/imagery/uploads/(?:start|status|complete|cancel)$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/workbench/imagery/uploads/chunk {
        client_max_body_size 131072;
        client_body_buffer_size 128k;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/api/workbench/public-geodata/(?:start|job|cancel)$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location = /api/workbench/imagery/upload {
        client_max_body_size 67108864;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ^~ /api/demo/ { default_type application/json; return 410 '{"code":"DEMO_NOT_PUBLISHED"}'; }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location /media/ { try_files $uri =404; }
    location /data/ { return 404; }
    location /sources/ { return 404; }
    location /models/ { return 404; }
    location /textures/ { return 404; }
    location /thumbnails/ { return 404; }
    location / { try_files $uri /index.html; }
}
server {
    listen 80;
    listen [::]:80;
    server_name vis.ontobase.ai;
    location / { return 301 https://vis.ontobase.ai$request_uri; }
}
