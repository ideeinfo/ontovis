server {
    listen 127.0.0.1:18082;
    server_name vis.ontobase.ai;
    # Only the existing local Cloudflare tunnel reaches this listener.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    if ($http_x_forwarded_proto = http) { return 301 https://vis.ontobase.ai$request_uri; }
    root /data/ontovis/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/geo+json text/css;
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","releaseId":"@RELEASE_ID@","engineeringServiceConnected":true}';
    }
    location ^~ /api/ {
        access_log off;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host vis.ontobase.ai;
        proxy_set_header X-Vis-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location ~* \.geojson$ { default_type application/geo+json; try_files $uri =404; }
    location ~* \.glb$ { default_type model/gltf-binary; try_files $uri =404; }
    location ~* \.md$ { default_type text/plain; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name vis.ontobase.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://vis.ontobase.ai$request_uri; }
}
