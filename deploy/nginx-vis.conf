# DEMO_REFERENCE_ONLY: local interaction reference; no public demo assets or API.
server {
    listen 127.0.0.1:18082;
    server_name vis.ontobase.ai;
    if ($http_x_forwarded_proto = http) { return 301 https://vis.ontobase.ai$request_uri; }
    charset utf-8;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Clear-Site-Data '"cache", "cookies", "storage"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /health {
        default_type application/json;
        return 200 '{"status":"not_published","demoPublic":false,"engineeringServiceConnected":false}';
    }
    location = / { return 503 "ONTOVis 尚未开放。\n"; }
    location = /index.html { return 503 "ONTOVis 尚未开放。\n"; }
    location ^~ /api/ {
        default_type application/json;
        return 410 '{"code":"DEMO_NOT_PUBLISHED"}';
    }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name vis.ontobase.ai;
    location / { return 301 https://vis.ontobase.ai$request_uri; }
}
